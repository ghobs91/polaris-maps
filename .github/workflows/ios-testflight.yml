# iOS TestFlight Build (macOS GitHub Actions)
#
# This workflow builds the Polaris Maps iOS app and uploads to TestFlight
# using Fastlane. It runs on a macOS runner and is triggered manually via
# workflow_dispatch.
#
# It does NOT submit for App Review or release to the public App Store.
#
# Required secrets (set in GitHub → Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID       — App Store Connect API Key ID
#   APP_STORE_CONNECT_ISSUER_ID    — App Store Connect API Issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY  — Full contents of the .p8 private key file
#   EXPO_PUBLIC_TOMTOM_API_KEY     — TomTom traffic API key
#   EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN — MapKit JS token for the POI card embed
#   EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL    — URL of the hosted place-detail page
#
# Optional EXPO_PUBLIC_* secrets (app features degrade gracefully without them,
# but the embed ones above are REQUIRED — see "Write CI .env file"):
#   EXPO_PUBLIC_HERE_API_KEY, EXPO_PUBLIC_APPLE_MAPKIT_TOKEN, EXPO_PUBLIC_MBTA_API_KEY,
#   EXPO_PUBLIC_WMATA_API_KEY, EXPO_PUBLIC_MOBILITY_DB_API_KEY,
#   EXPO_PUBLIC_MOBILITY_DB_REFRESH_TOKEN, EXPO_PUBLIC_OTP_BASE_URL,
#   EXPO_PUBLIC_TRANSITOUS_BASE_URL, EXPO_PUBLIC_GEONAMES_DB_URL,
#   EXPO_PUBLIC_OVERTURE_PLACES_PM_TILES_URL, EXPO_PUBLIC_REGION_CATALOG_URL,
#   EXPO_PUBLIC_TOMTOM_PROXY_URL

name: iOS TestFlight Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'beta'
        options:
          - beta
          - release

# Cancel in-progress runs when a new one is triggered
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    # match needs to clone + (on first run) push the `match` branch in this
    # repo, so the default GITHUB_TOKEN requires contents: write.
    permissions:
      contents: write

    steps:
      # -------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Environment
      # -------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # -------------------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------------------
      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # Write EXPO_PUBLIC_* env vars to .env so @expo/env inlines them
      # during Metro bundling (triggered by the Xcode build phase).
      # The .env file is gitignored; this creates it on the CI runner only.
      #
      # EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN and
      # EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL are REQUIRED: without them the POI
      # card's Apple "Photos & Reviews" embed silently disappears in the
      # shipped build (buildPlaceDetailUrl returns null).
      - name: Write CI .env file
        run: |
          # Trim stray whitespace/newlines that would survive a `-z` check
          # but parse as empty (or corrupt) values in the dotenv file.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          EMBED_TOKEN=$(trim "$EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN")
          PLACE_DETAIL_URL=$(trim "$EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL")
          {
            echo "EXPO_PUBLIC_TOMTOM_API_KEY=$EXPO_PUBLIC_TOMTOM_API_KEY"
            echo "EXPO_PUBLIC_TOMTOM_PROXY_URL=$EXPO_PUBLIC_TOMTOM_PROXY_URL"
            echo "EXPO_PUBLIC_HERE_API_KEY=$EXPO_PUBLIC_HERE_API_KEY"
            echo "EXPO_PUBLIC_APPLE_MAPKIT_TOKEN=$EXPO_PUBLIC_APPLE_MAPKIT_TOKEN"
            echo "EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN=$EMBED_TOKEN"
            echo "EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL=$PLACE_DETAIL_URL"
            echo "EXPO_PUBLIC_MBTA_API_KEY=$EXPO_PUBLIC_MBTA_API_KEY"
            echo "EXPO_PUBLIC_WMATA_API_KEY=$EXPO_PUBLIC_WMATA_API_KEY"
            echo "EXPO_PUBLIC_MOBILITY_DB_API_KEY=$EXPO_PUBLIC_MOBILITY_DB_API_KEY"
            echo "EXPO_PUBLIC_MOBILITY_DB_REFRESH_TOKEN=$EXPO_PUBLIC_MOBILITY_DB_REFRESH_TOKEN"
            echo "EXPO_PUBLIC_OTP_BASE_URL=$EXPO_PUBLIC_OTP_BASE_URL"
            echo "EXPO_PUBLIC_TRANSITOUS_BASE_URL=$EXPO_PUBLIC_TRANSITOUS_BASE_URL"
            echo "EXPO_PUBLIC_GEONAMES_DB_URL=$EXPO_PUBLIC_GEONAMES_DB_URL"
            echo "EXPO_PUBLIC_OVERTURE_PLACES_PM_TILES_URL=$EXPO_PUBLIC_OVERTURE_PLACES_PM_TILES_URL"
            echo "EXPO_PUBLIC_REGION_CATALOG_URL=$EXPO_PUBLIC_REGION_CATALOG_URL"
          } > .env
          # Strict validation — a whitespace-only secret passes `-z` but
          # parses to an empty value, which silently disables the embed.
          if [ -z "$EMBED_TOKEN" ] || [ -z "$PLACE_DETAIL_URL" ]; then
            echo "::error::EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN and EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL are required secrets — add them in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$PLACE_DETAIL_URL" in
            https://*) ;;
            *)
              echo "::error::EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL must start with https://"
              exit 1
              ;;
          esac
          case "$EMBED_TOKEN" in
            *[!A-Za-z0-9._-]*)
              echo "::error::EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN contains invalid characters (expected a base64url JWT)"
              exit 1
              ;;
          esac
          if [ "${#EMBED_TOKEN}" -lt 20 ]; then
            echo "::error::EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN is too short (${#EMBED_TOKEN} chars)"
            exit 1
          fi
          # Also export into the step environment so the xcodebuild bundle
          # phase inlines them from process.env even if .env file loading
          # misbehaves on the runner (@expo/env prefers process.env).
          echo "EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL=$PLACE_DETAIL_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN=$EMBED_TOKEN" >> "$GITHUB_ENV"
          echo "::notice::.env written — embed URL length ${#PLACE_DETAIL_URL}, embed token length ${#EMBED_TOKEN}"
        env:
          EXPO_PUBLIC_TOMTOM_API_KEY: ${{ secrets.EXPO_PUBLIC_TOMTOM_API_KEY }}
          EXPO_PUBLIC_TOMTOM_PROXY_URL: ${{ secrets.EXPO_PUBLIC_TOMTOM_PROXY_URL }}
          EXPO_PUBLIC_HERE_API_KEY: ${{ secrets.EXPO_PUBLIC_HERE_API_KEY }}
          EXPO_PUBLIC_APPLE_MAPKIT_TOKEN: ${{ secrets.EXPO_PUBLIC_APPLE_MAPKIT_TOKEN }}
          EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN: ${{ secrets.EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN }}
          EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL: ${{ secrets.EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL }}
          EXPO_PUBLIC_MBTA_API_KEY: ${{ secrets.EXPO_PUBLIC_MBTA_API_KEY }}
          EXPO_PUBLIC_WMATA_API_KEY: ${{ secrets.EXPO_PUBLIC_WMATA_API_KEY }}
          EXPO_PUBLIC_MOBILITY_DB_API_KEY: ${{ secrets.EXPO_PUBLIC_MOBILITY_DB_API_KEY }}
          EXPO_PUBLIC_MOBILITY_DB_REFRESH_TOKEN: ${{ secrets.EXPO_PUBLIC_MOBILITY_DB_REFRESH_TOKEN }}
          EXPO_PUBLIC_OTP_BASE_URL: ${{ secrets.EXPO_PUBLIC_OTP_BASE_URL }}
          EXPO_PUBLIC_TRANSITOUS_BASE_URL: ${{ secrets.EXPO_PUBLIC_TRANSITOUS_BASE_URL }}
          EXPO_PUBLIC_GEONAMES_DB_URL: ${{ secrets.EXPO_PUBLIC_GEONAMES_DB_URL }}
          EXPO_PUBLIC_OVERTURE_PLACES_PM_TILES_URL: ${{ secrets.EXPO_PUBLIC_OVERTURE_PLACES_PM_TILES_URL }}
          EXPO_PUBLIC_REGION_CATALOG_URL: ${{ secrets.EXPO_PUBLIC_REGION_CATALOG_URL }}

      # Canary: bundle the app JS directly (fast, before the 10+ minute native
      # build) and verify the embed values are inlined. Splits "env not
      # inlined at all" from "not inlined inside the xcodebuild phase".
      - name: Canary-check env inlining
        run: |
          npx expo export:embed --entry-file index.js --platform ios --dev false \
            --bundle-output /tmp/polaris-canary.jsbundle --assets-dest /tmp/polaris-canary-assets
          if ! grep -aFq "$EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL" /tmp/polaris-canary.jsbundle; then
            echo "::error::Canary bundle lacks the MapKit place-detail URL — env not inlined by expo export:embed"
            exit 1
          fi
          if ! grep -aFq "$EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN" /tmp/polaris-canary.jsbundle; then
            echo "::error::Canary bundle lacks the MapKit JS embed token — env not inlined by expo export:embed"
            exit 1
          fi
          echo "Canary bundle contains the MapKit embed config"
        env:
          EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL: ${{ secrets.EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL }}
          EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN: ${{ secrets.EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN }}

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install
          cd ..

      # -------------------------------------------------------------------
      # Validate (fail early on obvious issues)
      # -------------------------------------------------------------------
      - name: TypeScript check
        run: pnpm typecheck

      # Test suite has pre-existing failures (jest transform config for ESM
      # deps and unrelated unit failures). Make this advisory so the build
      # pipeline can still produce TestFlight builds. Fix the suite separately.
      - name: Run tests (advisory)
        run: pnpm test
        continue-on-error: true

      # -------------------------------------------------------------------
      # Write App Store Connect API key from secret
      # -------------------------------------------------------------------
      - name: Write App Store Connect API key
        run: |
          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "Skipping App Store Connect API key write (not set)" >&2
            exit 0
          fi
          mkdir -p ~/.appstoreconnect
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/ci_key.p8
          # Export the expanded absolute path so the Fastlane step doesn't
          # fall back to an unexpanded literal '$HOME/...' (GitHub does not
          # expand variables inside env: values).
          echo "APP_STORE_CONNECT_KEY_PATH=$HOME/.appstoreconnect/ci_key.p8" >> "$GITHUB_ENV"
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # -------------------------------------------------------------------
      # Git auth for fastlane match (clones/pushes the `match` branch).
      # -------------------------------------------------------------------
      - name: Configure git auth for match
        run: |
          git config --global user.name "polaris-ios-ci"
          git config --global user.email "polaris-ios-ci@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # -------------------------------------------------------------------
      # Build and upload via Fastlane
      # -------------------------------------------------------------------
      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios ${{ github.event.inputs.build_type || 'beta' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ env.APP_STORE_CONNECT_KEY_PATH || format('{0}/.appstoreconnect/ci_key.p8', github.workspace) }}
          EXPO_PUBLIC_TOMTOM_API_KEY: ${{ secrets.EXPO_PUBLIC_TOMTOM_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        timeout-minutes: 45

      # -------------------------------------------------------------------
      # Regression guard: the POI card's Apple "Photos & Reviews" embed is
      # silently hidden when EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL /
      # EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN are not inlined into the bundle.
      #
      # Exact-value checks: the bundle must contain the SAME URL and token the
      # CI .env provided. A bare '#token=' grep would be vacuous — that string
      # literal exists in the app source regardless of config.
      # -------------------------------------------------------------------
      - name: Verify MapKit embed config inlined into bundle
        run: |
          unzip -o -q build_derived_data/PolarisMaps.ipa 'Payload/PolarisMaps.app/main.jsbundle' -d /tmp/polaris-bundle-check
          BUNDLE=/tmp/polaris-bundle-check/Payload/PolarisMaps.app/main.jsbundle
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          URL_OK=0
          TOKEN_OK=0
          if grep -aFq "$EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL" "$BUNDLE" || grep -aFq "$(trim "$EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL")" "$BUNDLE"; then
            URL_OK=1
          fi
          if grep -aFq "$EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN" "$BUNDLE" || grep -aFq "$(trim "$EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN")" "$BUNDLE"; then
            TOKEN_OK=1
          fi
          if [ "$URL_OK" -ne 1 ]; then
            echo "::error::Shipped bundle does not contain the MapKit place-detail URL (not inlined at build time)"
            exit 1
          fi
          if [ "$TOKEN_OK" -ne 1 ]; then
            echo "::error::Shipped bundle does not contain the MapKit JS embed token (not inlined at build time)"
            exit 1
          fi
          echo "MapKit embed config present in shipped bundle"
        env:
          EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL: ${{ secrets.EXPO_PUBLIC_MAPKIT_PLACE_DETAIL_URL }}
          EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN: ${{ secrets.EXPO_PUBLIC_APPLE_MAPKITJS_EMBED_TOKEN }}

      # Keep the shipped bundle as a run artifact so it can be inspected
      # after the fact without a device or another build.
      - name: Prepare bundle artifact
        if: always()
        run: |
          if [ -f build_derived_data/PolarisMaps.ipa ]; then
            unzip -o -q build_derived_data/PolarisMaps.ipa 'Payload/PolarisMaps.app/main.jsbundle' -d /tmp/polaris-bundle-artifact
          fi

      - name: Upload main.jsbundle for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-main-jsbundle
          path: /tmp/polaris-bundle-artifact/Payload/PolarisMaps.app/main.jsbundle
          if-no-files-found: ignore

      # -------------------------------------------------------------------
      # Cleanup
      # -------------------------------------------------------------------
      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/ci_key.p8

      - name: Clean up temporary .env
        if: always()
        run: rm -f .env
