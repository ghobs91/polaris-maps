<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to Polaris Maps…</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f7f7f8;
        color: #111;
      }
      main {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #555;
        margin: 0;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #0a84ff;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111;
          color: #f5f5f7;
        }
        p {
          color: #a1a1a6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to Polaris Maps…</h1>
      <p>Mapillary sign-in finished. If the app does not open by itself, use the button below.</p>
      <a id="open" href="polaris-maps://mapillary-callback">Open Polaris Maps</a>
    </main>
    <script>
      (function () {
        // Keep the OAuth query string (code/state/error) intact. The target is
        // fixed, so no attacker-controlled redirect is possible.
        var target = 'polaris-maps://mapillary-callback' + window.location.search;
        document.getElementById('open').href = target;
        // ASWebAuthenticationSession intercepts this navigation and hands the
        // URL back to the app, which then exchanges the code for a token.
        setTimeout(function () {
          window.location.replace(target);
        }, 60);
      })();
    </script>
  </body>
</html>
